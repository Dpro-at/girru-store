name: Store index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Every manifest is valid and index.json is up to date
        run: node scripts/build-index.mjs --check

  browser-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/browser/runtime/package-lock.json
      - name: Install JavaScript dependencies without native downloads
        run: npm ci --ignore-scripts
      - name: Check browser ownership, transport and import boundaries
        run: npm test
      - name: Audit dependencies
        run: npm audit
