[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact public SPKI extension identity key; not a credential or private key."
condition = "AND"
paths = ['''^apps/browser/extension/manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key": "\+wCVxUg28TaRjgxYsNKjk\+OAXBe\+yD3Y\+ca93G7k9p4B9Iwi8K2UQFcyB5DcnvxZq5ywXvdp0FTuVOlzXY4QwIDAQAB",\s*$''']
