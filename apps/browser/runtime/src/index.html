<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>Girru Browser</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z"/><path d="m12 7 5 5-5 5-5-5Z"/></svg><strong>Browser</strong></div><span class="hint">Your work, one tab at a time</span><button id="new" aria-label="New tab" title="New tab (⌘/Ctrl+T)"></button></header>
<nav id="tabs" aria-label="Browser tabs"></nav>
<form id="location"><button id="back" type="button" aria-label="Back" title="Back"></button><button id="forward" type="button" aria-label="Forward" title="Forward"></button><button id="reload" type="button" aria-label="Reload" title="Reload"></button><label class="address"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 6 5 12 0 18-5-6-5-12 0-18Z"/></svg><input id="url" aria-label="Website address" placeholder="Search or enter an address" autocomplete="off" spellcheck="false"></label><label class="participant">Tab for<select id="agent" aria-label="Participant for new tabs"></select></label></form>
<main id="empty"><div class="empty-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 6 5 12 0 18-5-6-5-12 0-18Z"/></svg></div><h1>Where are we working?</h1><p>Enter a website above. Each participant keeps their own tabs.</p></main>
<footer><span id="status" role="status">Ready</span><span id="ownership">Private browsing workspace</span></footer><script src="renderer.js"></script></body></html>
